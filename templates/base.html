<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FinSight — Premium SQL Analytics{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        :root {
            /* Premium Fintech Palette */
            --bg-main: #0B0F14;
            --bg-surface: #141B23;
            --bg-elevated: #1B2430;
            --border-subtle: #293440;
            
            --accent-emerald: #34D399;
            --accent-emerald-dim: rgba(52, 211, 153, 0.12);
            --accent-blue: #60A5FA;
            --accent-blue-dim: rgba(96, 165, 250, 0.12);
            --danger-red: #F87171;
            --danger-dim: rgba(248, 113, 113, 0.12);
            
            --text-primary: #F4F7FA; 
            --text-secondary: #A3AFBF;
            --sidebar-width: 280px;
            --header-height: 72px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main) !important;
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Typography Essentials */
        .tabular-nums { font-variant-numeric: tabular-nums; }
        .text-light { color: var(--text-primary) !important; }
        .text-secondary { color: var(--text-secondary) !important; }
        .text-success { color: var(--accent-emerald) !important; }
        .text-danger { color: var(--danger-red) !important; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 99px; }

        .app-wrapper { display: flex; min-height: 100vh; width: 100vw; }

        /* Hidden Off-Canvas Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: calc(-1 * var(--sidebar-width)); /* Completely off-screen */
            z-index: 1040;
            opacity: 0;
            visibility: hidden;
            transition: left 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease, visibility 0.3s;
        }
        
        .sidebar.active {
            left: 0;
            opacity: 1;
            visibility: visible;
        }

        .sidebar-brand {
            height: var(--header-height);
            padding: 0 1.5rem;
            display: flex; align-items: center; gap: 0.75rem;
            border-bottom: 1px solid var(--border-subtle);
            text-decoration: none; flex-shrink: 0;
        }
        .brand-icon {
            width: 32px; height: 32px; border-radius: 8px;
            background: var(--accent-emerald-dim); border: 1px solid rgba(52, 211, 153, 0.3);
            color: var(--accent-emerald); display: flex; align-items: center; justify-content: center;
            font-size: 1rem;
        }
        .brand-text { font-weight: 700; font-size: 1.15rem; color: var(--text-primary); letter-spacing: -0.5px;}

        .nav-section-label {
            font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--text-secondary); padding: 1.5rem 1.5rem 0.5rem;
        }
        .sidebar-nav { padding: 0 1rem; display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }
        
        .nav-item-link {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.65rem 1rem; border-radius: 6px; color: var(--text-secondary);
            text-decoration: none; font-weight: 500; font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .nav-item-link:hover { background-color: var(--bg-elevated); color: var(--text-primary); }
        .nav-item-link.active {
            background-color: var(--accent-emerald-dim); color: var(--accent-emerald);
            font-weight: 600; border-left: 3px solid var(--accent-emerald);
            border-radius: 0 6px 6px 0;
        }

        /* Main Content - Full Width */
        .main-content {
            flex: 1; width: 100%; display: flex; flex-direction: column; min-width: 0; min-height: 100vh;
        }

        .top-navbar {
            height: var(--header-height); background-color: var(--bg-main);
            border-bottom: 1px solid var(--border-subtle); padding: 0 2rem;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 1020; flex-shrink: 0;
        }

        /* Smooth Page Transitions */
        .page-transition-wrapper {
            animation: fadeIn 0.3s ease forwards;
            flex: 1; display: flex; flex-direction: column;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-container { padding: 2rem; max-width: 1400px; width: 100%; margin: 0 auto; flex: 1; }
        
        .surface-card {
            background-color: var(--bg-surface); border: 1px solid var(--border-subtle);
            border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        /* Buttons & Inputs */
        .btn-ghost {
            background-color: transparent; color: var(--text-primary);
            border: 1px solid var(--border-subtle); border-radius: 8px;
            padding: 0.4rem 0.85rem; font-size: 0.85rem; font-weight: 600;
            text-decoration: none; transition: all 0.2s ease;
        }
        .btn-ghost:hover { background-color: var(--bg-elevated); }
        
        .btn-menu { border: none; padding: 0.5rem; border-radius: 6px; color: var(--text-primary); background: transparent; cursor: pointer;}
        .btn-menu:hover { background-color: var(--bg-surface); }

        .btn-emerald {
            background-color: var(--accent-emerald); color: #022c22; font-weight: 600;
            font-size: 0.85rem; border: none; border-radius: 8px; padding: 0.5rem 1.25rem;
            text-decoration: none; transition: all 0.2s ease; cursor: pointer;
        }
        .btn-emerald:hover { background-color: #2bb582; }

        .form-control, .form-select {
            background-color: var(--bg-elevated) !important; color: var(--text-primary) !important;
            border: 1px solid var(--border-subtle) !important; border-radius: 8px;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--accent-emerald) !important; box-shadow: 0 0 0 3px var(--accent-emerald-dim) !important;
        }

        /* Tables */
        .table { --bs-table-bg: transparent; --bs-table-color: var(--text-primary); --bs-table-border-color: var(--border-subtle); }
        .table-hover tbody tr:hover { background-color: var(--bg-elevated); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

<div class="app-wrapper">
    <!-- Backdrop for off-canvas sidebar -->
    <div id="sidebarBackdrop" class="position-fixed top-0 start-0 w-100 h-100 bg-black bg-opacity-50 d-none" style="z-index: 1035; backdrop-filter: blur(2px);" onclick="closeSidebar()"></div>

    <aside class="sidebar" id="appSidebar">
        <a href="{{ url_for('index') }}" class="sidebar-brand">
            <div class="brand-icon"><i class="bi bi-layers-fill"></i></div>
            <div class="brand-text">FinSight</div>
        </a>

        <div class="nav-section-label">Main Navigation</div>
        <nav class="sidebar-nav">
            <a href="{{ url_for('index') }}" class="nav-item-link {% if request.endpoint == 'index' %}active{% endif %}">
                <span><i class="bi bi-grid-1x2 me-2"></i> Overview</span>
            </a>
            <a href="{{ url_for('transactions') }}" class="nav-item-link {% if request.endpoint == 'transactions' %}active{% endif %}">
                <span><i class="bi bi-receipt-cutoff me-2"></i> Transactions</span>
            </a>
            <a href="{{ url_for('analytics') }}" class="nav-item-link {% if request.endpoint == 'analytics' %}active{% endif %}">
                <span><i class="bi bi-bar-chart-line me-2"></i> Analytics</span>
            </a>
            <a href="{{ url_for('categories') }}" class="nav-item-link {% if request.endpoint == 'categories' %}active{% endif %}">
                <span><i class="bi bi-database me-2"></i> SQL Explorer</span>
            </a>
            <a href="{{ url_for('reports') }}" class="nav-item-link {% if request.endpoint == 'reports' %}active{% endif %}">
                <span><i class="bi bi-file-earmark-text me-2"></i> Reports</span>
            </a>
            
            <div class="nav-section-label mt-3">System</div>
            <a href="{{ url_for('trash') }}" class="nav-item-link {% if request.endpoint == 'trash' %}active{% endif %}">
                <span><i class="bi bi-trash3 me-2"></i> Trash Bin</span>
                <span class="badge rounded-pill {% if trash_count > 0 %}bg-danger text-white{% else %}bg-secondary bg-opacity-25 text-secondary{% endif %} tabular-nums">{{ trash_count }}</span>
            </a>
            <a href="{{ url_for('settings') }}" class="nav-item-link {% if request.endpoint == 'settings' %}active{% endif %}">
                <span><i class="bi bi-gear me-2"></i> Settings</span>
            </a>
        </nav>
    </aside>

    <div class="main-content" id="mainContent">
        <header class="top-navbar">
            <div class="d-flex align-items-center gap-3">
                <button class="btn-menu d-flex align-items-center justify-content-center" type="button" onclick="toggleSidebar()" aria-label="Toggle Menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <h1 class="h5 fw-bold mb-0 text-light" style="letter-spacing: -0.5px;">{% block header_title %}Dashboard{% endblock %}</h1>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="text-secondary small fw-medium d-none d-sm-block">Admin Workspace</span>
            </div>
        </header>

        <div class="page-transition-wrapper">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>

<script>
    const sidebar = document.getElementById('appSidebar');
    const backdrop = document.getElementById('sidebarBackdrop');

    function toggleSidebar() {
        sidebar.classList.toggle('active');
        backdrop.classList.toggle('d-none');
    }

    function closeSidebar() {
        sidebar.classList.remove('active');
        backdrop.classList.add('d-none');
    }

    // Close sidebar on Escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sidebar.classList.contains('active')) {
            closeSidebar();
        }
    });
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
